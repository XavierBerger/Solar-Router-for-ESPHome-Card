title: Solar Router Card Dev

views:
  # Every real router configuration of the firmware repository, rendered from
  # the fixtures the demo bundle carries. No hardware needed.
  - title: Routers
    path: routers
    cards:
      - type: custom:solar-router-demo-card
        demo: engine_1dimmer_fronius
      - type: custom:solar-router-demo-card
        demo: engine_1dimmer_2switches
      - type: custom:solar-router-demo-card
        demo: engine_1dimmer_2switches_1bypass
      - type: custom:solar-router-demo-card
        demo: engine_1dimmer_1bypass
      - type: custom:solar-router-demo-card
        demo: engine_1switch_ha_limiter
      - type: custom:solar-router-demo-card
        demo: engine_1dimmer_ds18b20_counter
      - type: custom:solar-router-demo-card
        demo: engine_1dimmer_scheduler
      - type: custom:solar-router-demo-card
        demo: engine_1dimmer_em3
      - type: custom:solar-router-demo-card
        demo: engine_1dimmer_jsy_debug
      - type: custom:solar-router-demo-card
        demo: engine_1dimmer_fan
      - type: custom:solar-router-demo-card
        demo: proxy_only

  # The states no configuration produces: the ones that are easy to get wrong
  # and impossible to see on real hardware without breaking something.
  - title: Edge cases
    path: edge-cases
    cards:
      # Firmware older than the version sensors: must invite an update.
      - type: custom:solar-router-demo-card
        demo: legacy_no_versions
      # Booted seconds ago: must stay supported, versions showing as pending.
      - type: custom:solar-router-demo-card
        demo: booting
      # Device offline: must stay supported, not fall back to "outdated".
      - type: custom:solar-router-demo-card
        demo: offline
      # Diagnostic entities switched off: must say so, not "update your packages".
      - type: custom:solar-router-demo-card
        demo: versions_disabled

  # The production card, against whatever is really in this instance. With no
  # ESPHome router around it shows the "pick a device" and "not a router"
  # states, which is exactly what it should do.
  - title: Real
    path: real
    cards:
      - type: custom:solar-router-card
        device_id: ""
